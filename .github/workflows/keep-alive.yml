name: Keep Alive Ping

on:
  schedule:
    # Run every 10 minutes to prevent Render free tier from spinning down
    - cron: "*/10 * * * *"
  workflow_dispatch: # Allow manual triggering from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Healthz Endpoint
        run: |
          echo "Pinging https://vera-ai-r9if.onrender.com/v1/healthz to keep the app awake..."
          curl -f https://vera-ai-r9if.onrender.com/v1/healthz || echo "Ping failed but workflow will continue"
